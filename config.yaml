# EdgeDash user profile — edit this file, never commit secrets here.
# All fields are optional; sensible defaults are applied for missing ones.

# The job title you are targeting.
target_role: "Security Engineer"

# City used to filter job listings.
target_city: "Berlin"

# Keywords that boost relevance when scoring a listing.
keywords:
  - "Security"
  - "SQL"
  - "Python"
  - "Power BI"
  - "Tableau"
  - "ETL"
  - "data pipeline"

# Your current skill set (used for gap analysis).
my_skills:
  - "Security"
  - "Python"
  - "SQL"
  - "pandas"
  - "Excel"
  - "data visualization"
  - "statistical analysis"

# Years of relevant experience (used in fit scoring).
experience_years: 3

# Path to the SQLite database file (relative to repo root).
# In week 4 this becomes a Postgres connection string; change it here only.
db_path: "edgedash.db"

# Listings with a fit score below this threshold are hidden from the dashboard.
min_fit_score: 50

# Job board sources to query each cycle.
# Available: "arbeitnow" (no key needed), "apify" (needs APIFY_TOKEN in .env)
sources:
  - "arbeitnow"
  # - "apify"   # uncomment after adding APIFY_TOKEN to .env

# Set to true to use the hardcoded mock fetcher instead of live sources.
# Useful for offline development and testing.
use_mock_fetcher: false

# LLM provider used by the Scorer agent.
# Supported providers: "gemini" (needs GEMINI_API_KEY in .env),
#                      "ollama"  (local, no key required).
llm_provider: "gemini"
llm_model: "gemini-3.5-flash"

# Maximum listings scored per cycle (rule 21 — cost/rate-limit guard).
llm_batch_size: 25

# ---------------------------------------------------------------------------
# Orchestration thresholds — used by the Orchestrator's planning logic.
# ---------------------------------------------------------------------------

# How many hours must pass since the last fetch before fetching again.
fetch_interval_hours: 6

# Hard limits passed to each agent as stop conditions (rule 29).
# The agent never decides its own limits — the Orchestrator sets them.
fetch_max_pages: 5
fetch_max_listings: 200
score_max_seconds: 300
analyse_max_seconds: 60

# ---------------------------------------------------------------------------
# Skill alias map — THIS IS YOURS TO EDIT.
# When you see two raw strings that mean the same skill, add an entry here.
# Format: "raw normalised form": "canonical name"
# The key is what canonical() produces BEFORE the alias lookup (already
# lowercased, whitespace-collapsed, parentheticals stripped).
# Adding entries here is expected as you inspect your own --audit output.
# ---------------------------------------------------------------------------
skill_aliases:
  # Kubernetes variants
  "k8s": "kubernetes"

  # Node / JavaScript — deliberately kept separate (different skills)
  "nodejs": "node"
  "node.js": "node"

  # Postgres variants
  "postgresql": "postgres"
  "psql": "postgres"

  # Google Cloud variants
  "google cloud": "gcp"
  "google cloud platform": "gcp"

  # Machine learning shorthand
  "ml": "machine learning"

  # CI/CD variants
  "ci cd": "ci/cd"
  "cicd": "ci/cd"

  # Common JS framework / runtime aliasing
  "reactjs": "react"
  "react.js": "react"
  "vuejs": "vue"
  "vue.js": "vue"
  "nextjs": "next.js"

  # Data tooling
  "pandas": "pandas"           # keep as-is but normalises "Pandas"
  "scikit learn": "scikit-learn"
  "scikit-learn": "scikit-learn"

  # Cloud shorthand
  "amazon web services": "aws"
  "microsoft azure": "azure"

  # Misc common collisions
  "typescript": "typescript"   # keep; normalises "TypeScript"
  "javascript": "javascript"   # keep; normalises "JavaScript"
  "golang": "go"

# Target seniority level for scoring.
# One of: junior, mid, senior, lead
target_seniority: "mid"

# Scoring weights — must sum to 1.0 (loader normalises automatically).
w_skill_match:   0.45
w_seniority_fit: 0.25
w_location_fit:  0.15
w_recency:       0.15
